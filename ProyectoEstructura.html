            raise IndexError("Bicola vacía")
        return self.cola[0]

    def peek_back(self):

    def __init__(self, capacidad):
        self.capacidad = capacidad
        self.cola = [None] * capacidad
        self.frente = -1
        self.final = -1

    def esta_llena(self):
        return (self.final + 1) % self.capacidad == self.frente

    def esta_vacia(self):
        return self.frente == -1

    def encolar(self, dato):
        if self.esta_llena():
            print("La cola está llena")
            return
        if self.esta_vacia():
            self.frente = 0
            self.final = 0
        else:
            self.final = (self.final + 1) % self.capacidad
        self.cola[self.final] = dato

    def desencolar(self):
        if self.esta_vacia():

    def __init__(self, capacidad: int):
        self.capacidad = capacidad
        self.cola = [None] * capacidad
        self.frente = 0
        self.final = -1
        self.tamano = 0

    def enque(self, elemento: int) -> None:
        if self.tamano == self.capacidad:
            raise OverflowError("Cola circular llena")
        self.final = (self.final + 1) % self.capacidad
        self.cola[self.final] = elemento
        self.tamano += 1

    def dequeue(self) -> int:
        if self.tamano == 0:
            raise IndexError("Cola circular vacía")
        elemento = self.cola[self.frente]
        self.cola[self.frente] = None
        self.frente = (self.frente + 1) % self.capacidad
        self.tamano -= 1
        return elemento

    def peek(self) -> int:
        if self.tamano == 0:
            raise IndexError("Cola circular vacía")
        return self.cola[self.frente]

    def is_empty(self) -> bool:
        return self.tamano == 0

    def size(self) -> int:
        return self.tamano

    def mostrar(self) -> list:
        elementos = []
        idx = self.frente
        for _ in range(self.tamano):
            elementos.append(self.cola[idx])
            idx = (idx + 1) % self.capacidad
        return elementos

# Implementacion de la generacion de una tabla

import heapq

def dijkstra(grafo, inicio):
    distancias = {nodo: float('inf') for nodo in grafo}
    distancias[inicio] = 0
    previos = {nodo: None for nodo in grafo}

    cola_prioridad = [(0, inicio)]

    while cola_prioridad:
        distancia_actual, nodo_actual = heapq.heappop(cola_prioridad)

        if distancia_actual > distancias[nodo_actual]:
            continue

        for vecino, peso in grafo[nodo_actual].items():
            distancia = distancia_actual + peso

            if distancia < distancias[vecino]:
                distancias[vecino] = distancia
                previos[vecino] = nodo_actual
                heapq.heappush(cola_prioridad, (distancia, vecino))

    return distancias, previos

  document.getElementById('pname').textContent = item.name;
  document.getElementById('filename').textContent = item.file;

function highlight(code) {
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(#[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/\b(def|class|return|if|else|elif|for|while|in|not|and|or|import|from|True|False|None|self|lambda|pass|break|continue|raise|try|except|with|as|yield|del|global|nonlocal)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(print|range|len|sum|max|min|sorted|list|dict|set|tuple|str|int|float|bool|append|pop|insert|remove|heappush|heappop|enumerate|zip|map|filter|reversed|open|type|isinstance|hasattr|getattr|vars|dir)\b/g,'<span class="fn">$1</span>')
    .replace(/("""[\s\S]*?"""|'''[\s\S]*?'''|f?"[^"]*"|f?'[^']*')/g,'<span class="st">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="nm">$1</span>');
}

          txt(c,k,x,y,{size:14,bold:true,color:C.text});
        });
        txt(c,`Cola: [${queue.join(', ')}]`,10,12,{size:10,mono:true,align:'left',color:C.muted});
        txt(c,`Visitados: [${vis.join(', ')}]`,10,28,{size:10,mono:true,align:'left',color:C.green});
      }};
    }
    const vis=[],q=['A'];
    steps.push(bfsFrame([],null,['A'],'Inicio: enqueue A'));
    while(q.length){ const cur=q.shift(); vis.push(cur); steps.push(bfsFrame([...vis],cur,[...q],`Procesando ${cur}`)); (graph[cur]||[]).forEach(nb=>{if(!vis.includes(nb)&&!q.includes(nb)){q.push(nb);steps.push(bfsFrame([...vis],cur,[...q],`Enqueue vecino ${nb}` ));}}); }
    return;
  }

  if (v === 'dijkv') {
    const pos={0:{x:.12,y:.5},1:{x:.32,y:.2},2:{x:.65,y:.82},3:{x:.6,y:.28},4:{x:.45,y:.6},5:{x:.78,y:.28},6:{x:.52,y:.72},7:{x:.82,y:.55}};
    const graph={0:{1:9,4:6},1:{0:9,3:8},2:{4:5,5:6},3:{1:8,5:1,7:7},4:{0:6,2:5,6:3},5:{2:6,3:1},6:{4:3,7:2},7:{3:7,6:2}};
    const dist={}, prev={};
    Object.keys(graph).forEach(n=>{dist[n]=Infinity;prev[n]=null;}); dist[0]=0;
    function dijkFrame(vis,cur,label) {
      return { label, draw(c,W,H) {
        Object.keys(graph).forEach(u=>Object.keys(graph[u]).forEach(v=>{if(+u<+v){ const pu=pos[u],pv=pos[v]; line(c,pu.x*W,pu.y*H,pv.x*W,pv.y*H,C.border,1); txt(c,graph[u][v],(pu.x+pv.x)/2*W,(pu.y+pv.y)/2*H,{size:9,mono:true,color:C.muted}); }}));
        Object.keys(graph).forEach(n=>{ const p=pos[n],x=p.x*W,y=p.y*H,isV=vis.includes(+n),isCur=+n===+cur; circle(c,x,y,20, isCur?C.accent:isV?C.green+'33':C.surf, isCur?C.accent:isV?C.green:C.border, isCur||isV?2:1.5); txt(c,n,x,y,{size:13,bold:true}); const d=dist[n]; txt(c,d===Infinity?'inf':d,x,y+26,{size:9,mono:true,color:C.orange}); });
      }};
    }
    const vis=[], pq=[[0,0]];
    steps.push(dijkFrame([],null,'Inicio Dijkstra desde nodo 0'));
    while(pq.length){ pq.sort((a,b)=>a[0]-b[0]); const [d,u]=pq.shift(); if(vis.includes(u))continue; vis.push(u); steps.push(dijkFrame([...vis],u,`Visitando nodo ${u} (dist=${d})`)); Object.entries(graph[u]).forEach(([v,w])=>{ const nd=dist[u]+w; if(nd<dist[v]){dist[v]=nd;prev[v]=u;pq.push([nd,+v]);steps.push(dijkFrame([...vis],u,`dist[${v}] = ${nd}`));} }); }
    return;
  }

  if (v === 'primv') {
    const pos={'0':{x:.2,y:.3},'1':{x:.5,y:.15},'2':{x:.2,y:.72},'3':{x:.7,y:.72},'4':{x:.65,y:.35},'5':{x:.85,y:.55}};
    const graph={'0':{'2':20,'1':10},'1':{'0':10,'4':10,'3':50},'2':{'0':20,'4':33,'3':20},'3':{'1':50,'2':20,'4':20,'5':2},'4':{'2':33,'1':10,'3':20,'5':1},'5':{'4':1,'3':2}};
    const mstEdges=[];
    function primFrame(vis,mst,label) {
      return { label, draw(c,W,H) {
        Object.keys(graph).forEach(u=>Object.keys(graph[u]).forEach(v=>{if(+u<+v){ const pu=pos[u],pv=pos[v]; line(c,pu.x*W,pu.y*H,pv.x*W,pv.y*H,C.border,1); txt(c,graph[u][v],(pu.x+pv.x)/2*W,(pu.y+pv.y)/2*H,{size:9,mono:true,color:C.muted}); }}));
        mst.forEach(([u,v])=>{ const pu=pos[u],pv=pos[v]; line(c,pu.x*W,pu.y*H,pv.x*W,pv.y*H,C.green,3); });
        Object.keys(graph).forEach(n=>{ const p=pos[n],x=p.x*W,y=p.y*H,isV=vis.includes(n); circle(c,x,y,20,isV?C.green+'33':C.surf,isV?C.green:C.border,isV?2:1.5); txt(c,n,x,y,{size:14,bold:true}); });
        txt(c,'Verde = aristas del MST',W/2,H-16,{size:10,color:C.muted});
      }};
    }
    const vis=['2']; steps.push(primFrame([...vis],[],'Inicio Prim desde nodo 2'));
    const pq=[]; Object.entries(graph['2']).forEach(([v,w])=>pq.push([w,'2',v]));
    while(pq.length){ pq.sort((a,b)=>a[0]-b[0]); const [w,u,v]=pq.shift(); if(vis.includes(v))continue; vis.push(v); mstEdges.push([u,v]); steps.push(primFrame([...vis],[...mstEdges],`Arista ${u}-${v} (peso ${w})`)); Object.entries(graph[v]).forEach(([nb,pw])=>{if(!vis.includes(nb))pq.push([pw,v,nb]);}); }
    return;
  }

  if (v === 'hanoi') {
    const N=4, rods={A:[],B:[],C:[]};
    for(let i=N;i>=1;i--) rods.A.push(i);
    function hFrame(state, moved, label) {
      return { label, draw(c,W,H) {
        const rdX={A:W*0.2,B:W*0.5,C:W*0.8}, baseY=H-50, maxW=90, dh=20;
        ['A','B','C'].forEach(r => {
          const x=rdX[r]; c.fillStyle=C.border; c.fillRect(x-3,baseY-N*dh-20,6,N*dh+20); c.fillRect(x-52,baseY,104,7);
          txt(c,r,x,baseY+24,{size:14,bold:true,color:C.muted});
          state[r].forEach((disk,i) => {
            const w=18+disk*(maxW/N), y=baseY-(i+1)*dh, isMoved=moved===disk;
            c.fillStyle=isMoved?C.accent:['#e55','#f90','#2a9','#39d'][disk-1]||C.muted;
            c.beginPath(); c.roundRect(x-w/2,y,w,dh-2,4); c.fill();
            txt(c,disk,x,y+(dh-2)/2,{size:9,mono:true,color:'#fff',bold:true});
          });
        });
      }};
    }
    steps.push(hFrame({A:[...rods.A],B:[...rods.B],C:[...rods.C]},null,`Torres de Hanoi - ${N} discos`));
    function hanoi(n,from,to,aux){ if(n===0)return; hanoi(n-1,from,aux,to); const disk=rods[from].pop(); rods[to].push(disk); steps.push(hFrame({A:[...rods.A],B:[...rods.B],C:[...rods.C]},disk,`Disco ${disk}: ${from} -> ${to}`)); hanoi(n-1,aux,to,from); }
    hanoi(N,'A','C','B');
    return;
  }

  
}

setMode('both');
select(CATS[0].items[0], CATS[0].color, CATS[0].name);
</script>
